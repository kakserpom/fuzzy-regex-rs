description = "Ported from mrab-regex tests/test_regex.py fuzzy assertions"

# ---------------------------------------------------------------------------
# Scattered fuzzy assertion in test_word_class (L654, L657): findall with
# nested fuzzy inside a lookbehind plus \m / \M word boundaries.
# ---------------------------------------------------------------------------
[[test]]
name = "L654 word e<=3 with fuzzy lookbehind (V0)"
pattern = '(?iV0)\m(?:word){e<=3}\M(?<!\m(?:word){e<=1}\M)'
compiles = true
ignore = true   # GAP: mrab compiles, ours errors ()

[[test]]
name = "L657 word e<=3 with fuzzy lookbehind (V1) - fuzzy inside lookbehind + \\m/\\M unsupported"
pattern = '(?iV1)\m(?:word){e<=3}\M(?<!\m(?:word){e<=1}\M)'
compiles = true
ignore = true   # GAP: mrab compiles, ours errors (fuzzy inside lookbehind + \\m/\\M unsupported)

