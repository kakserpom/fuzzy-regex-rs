[package]
name = "fuzzy-regex"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "High-performance fuzzy regular expression engine combining regex with Damerau-Levenshtein distance"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["regex", "fuzzy", "levenshtein", "approximate", "matching"]
categories = ["text-processing", "algorithms"]
homepage = "https://github.com/kakserpom/fuzzy-regex-rs"
repository = "https://github.com/kakserpom/fuzzy-regex-rs"
documentation = "https://kakserpom.github.io/fuzzy-regex-rs/"

[features]
default = ["simd"]
simd = []
mimalloc = ["dep:mimalloc"]
fuzzy-aho-corasick = ["dep:aho-corasick"]

[dependencies]
unicode-segmentation = "1.12"
thiserror = "2.0"
memchr = "2.8"
mimalloc = { version = "0.1", default-features = false, optional = true }
aho-corasick = { version = "1.1", optional = true }

[dev-dependencies]
criterion = "0.8.2"
regex = "1"
arbitrary = { version = "1", features = ["derive"] }
proptest = "1.10"
fuzzy-aho-corasick = "0.3.7"
toml = "0.8"
serde = { version = "1.0.229", features = ["derive"] }

[[bench]]
name = "fuzzy_benchmarks"
harness = false

[profile.release]
lto = true
codegen-units = 1
