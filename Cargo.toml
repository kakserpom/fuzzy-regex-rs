[package]
name = "fuzzy-regex"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "High-performance fuzzy regular expression engine combining regex with Damerau-Levenshtein distance"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["regex", "fuzzy", "levenshtein", "approximate", "matching"]
categories = ["text-processing", "algorithms"]
homepage = "https://github.com/kakserpom/fuzzy-regex-rs"
repository = "https://github.com/kakserpom/fuzzy-regex-rs"
documentation = "https://kakserpom.github.io/fuzzy-regex-rs/"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/CHANGELOG.md"]

[features]
default = ["simd", "word-list-ac"]
simd = []
mimalloc = ["dep:mimalloc"]
fuzzy-aho-corasick = ["dep:aho-corasick"]
# Aho-Corasick fast path for large `\L<name>` word lists (uses the
# fuzzy-aho-corasick crate). On by default; disable for a lighter dependency
# tree if you do not use large named lists.
word-list-ac = ["dep:fuzzy-aho-corasick"]

[dependencies]
unicode-segmentation = "1.12"
thiserror = "2.0"
memchr = "2.8"
mimalloc = { version = "0.1", default-features = false, optional = true }
aho-corasick = { version = "1.1", optional = true }
fuzzy-aho-corasick = { version = "0.4", optional = true }
unicode_names2 = "3.1.0"
caseless = "0.2.2"

[dev-dependencies]
criterion = "0.8.2"
regex = "1"
arbitrary = { version = "1", features = ["derive"] }
proptest = "1.10"
fuzzy-aho-corasick = "0.4"
toml = "0.8"
serde = { version = "1.0.229", features = ["derive"] }

[[bench]]
name = "fuzzy_benchmarks"
harness = false

[profile.release]
lto = true
codegen-units = 1
